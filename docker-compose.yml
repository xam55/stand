x-django: &django
  build: .
  volumes:
    - .:/app
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    EMAIL_HOST: mailpit
    EMAIL_PORT: 1025
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    rabbitmq:
      condition: service_started
    minio:
      condition: service_started

services:
  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn drfsite.asgi:application --host 0.0.0.0 --port 8000 --reload"

  celery_cpu:
    <<: *django
    command: celery -A drfsite worker -l info -Q cpu -P prefork -c 15 -n cpu@%h

  celery_io:
    <<: *django
    command: celery -A drfsite worker -l info -Q io -P gevent -c 200 -n io@%h

  celery_beat:
    <<: *django
    command: celery -A drfsite beat -l info

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  minio:
    image: bitnamilegacy/minio:2025.4.22
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data

  minio_init:
    image: bitnamilegacy/minio:2025.4.22
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
             mc mb --ignore-existing local/women-photos &&
             mc anonymous set-json /policy.json local/women-photos &&
             mc mb --ignore-existing local/women-docs"
    volumes:
      - ./minio/policy.json:/policy.json:ro
    depends_on:
      - minio
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/var/www/static:ro
    depends_on:
      - web

volumes:
  minio_data:
  pg_data:
